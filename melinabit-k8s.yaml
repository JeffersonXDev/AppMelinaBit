apiVersion: apps/v1
kind: Deployment
metadata:
  name: melinabit-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: melinabit
  template:
    metadata:
      labels:
        app: melinabit
    spec:
      containers:
      - name: melinabit
        image: appmelinabit-app-melinabit:latest  # A imagem que você buildou no Docker
        imagePullPolicy: Never # Importante: diz ao K3s para usar a imagem local
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://192.168.1.102:5432/melinabit_db" # Apontando para o Postgres do Docker
        - name: ADMIN_PASS
          value: "Jeffbl1980"
---
apiVersion: v1
kind: Service
metadata:
  name: melinabit-service
spec:
  selector:
    app: melinabit
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer

