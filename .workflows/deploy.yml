name: Deploy to Amazon EC2

        on:
        push:
        branches: [ "main" ] # Sempre que você der push na main, ele atualiza a AWS

        jobs:
        deploy:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v3

        - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

        - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

        - name: Build and Push Docker Image
        run: |
        docker build -t 345157803968.dkr.ecr.us-east-1.amazonaws.com/appmelinabit:latest .
        docker push 345157803968.dkr.ecr.us-east-1.amazonaws.com/appmelinabit:latest

        - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
        host: 3.239.213.243
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
        aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 345157803968.dkr.ecr.us-east-1.amazonaws.com
        docker pull 345157803968.dkr.ecr.us-east-1.amazonaws.com/appmelinabit:latest
        docker stop api-melina || true
        docker rm api-melina || true
        docker run -d -p 8080:8080 --name api-melina 345157803968.dkr.ecr.us-east-1.amazonaws.com/appmelinabit:latest