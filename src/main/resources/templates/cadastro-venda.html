<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cadastro - MelinaBit, Seu Gerenciamento de Apiários!</title>
	<link rel="stylesheet" th:href="@{/css/global.css}">
	<link rel="stylesheet" th:href="@{/css/cadastro.css}">
</head>

<body class="allow-scroll">

	<div class="form-wrapper">
		<div class="form-container">
			<h2>Cadastro de Venda de Produtos:</h2>
			
			<form th:action="@{/gerenciar/venda}" th:object="${movimentacao}" method="post">
			
                <div class="form-group">
                    <label for="nome">Nome do Produto:</label>
                    <input type="text" id="nome" th:field="*{nome}" required>
                </div>

                <div class="form-group">
                    <label for="cliente">Cliente:</label>
                    <select id="cliente" th:field="*{cliente.id}" required>
                        <option value="">Selecione o Cliente</option>
                        <option th:each="cliente : ${clientes}" 
                                th:value="${cliente.id}" 
                                th:text="${cliente.nome}">Nome do Cliente</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="unidadeMedida">Produto:</label>
                    <select id="unidadeMedida" th:field="*{unidadeMedida}" required>
                        <option value="">Selecione o Tipo e Peso/Volume</option>
                        <optgroup label="Mel/Outros (Pesos - Gramas/Kilos)">
                            <option value="250g_mel">Frasco 250 Gramas</option>
							<option value="500g_mel">Frasco 500 Gramas</option>
							<option value="750g_mel">Frasco 750 Gramas</option>
							<option value="1kg_mel">Frasco 1 Kilo</option>
							<option value="10kg_balde">Balde 10 Kilos</option>
							<option value="20kg_balde">Balde 20 Kilos</option>
                            <option value="30kg_balde">Balde 30 Kilos</option>
                        </optgroup>
                        <optgroup label="Pólen (Pesos - Gramas/Kilos)">
                            <option value="1kg_polen">Pólen 1 Kilo</option>
							<option value="500g_polen">Bote de 500 Gramas</option>
							<option value="250g_polen">Bote de 250 Gramas</option>
							<option value="100g_polen">Bote de 100 Gramas</option>
                        </optgroup>
                        <optgroup label="Cera (Pesos - Gramas/Kilos)">
							<option value="1kg_cera">Cera 1 Kilo</option>
							<option value="500g_cera">Cera de 500 Gramas</option>
							<option value="250g_cera">Cera de 250 Gramas</option>
                        </optgroup>
                        <optgroup label="Própolis (Volume - ML/Litros)">
                            <option value="1L_extrato">Frasco 1 Litro (L)</option>
							<option value="500ml_extrato">Frasco 500ml</option>
							<option value="250ml_extrato">Frasco 250ml</option>
							<option value="100ml_extrato">Frasco 100ml</option>
							<option value="30ml_extrato">Frasco 30ml</option>
						</optgroup>
                    </select>
                </div>

                <div class="form-group">
                    <label for="quantidade">Quantidade:</label>
                    <input type="number" id="quantidade" th:field="*{quantidade}" min="1" required>
                </div>

                <div class="form-group">
                    <label for="valorVendaUnitario">Preço Unitário (R$):</label>
                    <input type="number" id="valorVendaUnitario" name="valorVendaUnitario" step="0.01" min="0" required>
                    <small>Este valor será usado para calcular o total da venda.</small>
                </div>
				<div class="form-group">
				    <label for="valorVendaUnitario">Valor do Frete (R$):</label>
				    <input type="number" id="valorFreteUnitario" name="valorFreteUnitario" step="0.01" min="0" required>
				    <small>Valor do Frete se houver.</small>
				</div>

				<div class="form-group"> 
				    <label for="valorVenda">Valor Total da Venda (R$):</label>
				    <input type="number" id="valorVenda" th:field="*{valorVenda}" readonly> 
				    <small>Quantidade * Preço Unitário + Frete.</small>
				</div> 
                
                <button type="submit" class="btn btn-primary">Cadastrar</button>
               
			</form>

			<div class="form-link">
				<p><a th:href="@{/gerenciar/venda}">Cadastrar outra Venda</a> ou <a th:href="@{/dashboard}">Voltar</a></p>	
			</div>
		</div>
	</div>

    <script th:src="@{/js/script_venda.js}"></script>
</body>

</html>
