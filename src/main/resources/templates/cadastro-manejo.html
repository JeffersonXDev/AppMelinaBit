<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Registro de Manejo - MelinaBit</title>
	<!-- Mantenha seus links CSS existentes -->
	<link rel="stylesheet" th:href="@{/css/global.css}">
	<link rel="stylesheet" th:href="@{/css/cadastro.css}">
</head>

<body class="allow-scroll">

	<div class="form-wrapper">
		<div class="form-container">
			<h2>Registro de Manejo de Colmeia:</h2>
			
			<!-- Ação correta: POST para /gerenciar/manejo -->
			<form th:action="@{/gerenciar/manejo}" th:object="${manejo}" method="post">
			
                <div class="form-group">
                    <label for="apiarioId">Apiário:</label>
                      <select id="apiarioId" th:field="*{apiario}" required>
                        <option value="">Selecione o Apiário</option>

                        <option th:each="apiarioOp : ${apiarios}" 
                                th:value="${apiarioOp.idApiario}" 
                                th:text="${apiarioOp.nome}">
                        </option>
                    </select>
                </div>
                
                <input type="hidden" th:field="*{idManejo}" />
                <input type="hidden" th:field="*{usuario}" />
                <div class="form-group">
                    <label for="numeroColmeia">Número da Colmeia:</label>
                    <input type="text" id="numeroColmeia" th:field="*{numeroColmeia}" required 
                           placeholder="Ex: 01">
                </div>
                
                <div class="form-group">
                    <label for="dataInspecao">Data do Manejo:</label>
                    <input type="date" id="dataInspecao" th:field="*{dataInspecao}" required>
                </div>

                <div class="form-group">
                    <label for="quadros">Quadros com Abelhas:</label>
                    <input type="number" id="quadros" th:field="*{quadros}" min="0" required>
                </div>
                <div class="form-group">
                    <label for="ovo">Ovo (dias):</label>
                    <input type="number" id="ovo" th:field="*{ovo}" min="0">
                </div>
                <div class="form-group">
                    <label for="criasOperculadas">Crias Operculadas (dias):</label>
                    <!-- ID Padronizado para camelCase (criasOperculadas) -->
                    <input type="number" id="criasOperculadas" th:field="*{criasOperculadas}" min="0">
                </div>
                
                <div class="form-group">
                    <label for="polen">Pólen (Quadros):</label>
                    <input type="number" id="polen" th:field="*{polen}" min="0">
                </div>
                <div class="form-group">
                    <label for="necta">Néctar (Quadros):</label>
                    <input type="number" id="necta" th:field="*{necta}" min="0">
                </div>
                <div class="form-group">
                    <label for="mel">Mel (Quadros):</label>
                    <input type="number" id="mel" th:field="*{mel}" min="0">
                </div>
                <div class="form-group">
                    <label for="ceraNova">Cera Nova (Quadros):</label>
                    <!-- ID Padronizado para camelCase (ceraNova) -->
                    <input type="number" id="ceraNova" th:field="*{ceraNova}" min="0">
                </div>
                
                <div class="form-group">
                    <label for="posturasBoas">Posturas Boas:</label>
                    <!-- posturasBoas (Boolean) espera 'true'/'false' -->
                    <select id="posturasBoas" th:field="*{posturasBoas}">
                        <option value="true">Sim</option>
                        <option value="false">Não</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="criasUniformes">Crias Uniformes:</label>
                    <!-- criasUniformes (Boolean) espera 'true'/'false' -->
                    <select id="criasUniformes" th:field="*{criasUniformes}">
                        <option value="true">Sim</option>
                        <option value="false">Não</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="alimentador">Alimentador (Aplicado):</label>
                    <!-- alimentador (Integer/int4 no DB) deve enviar '1'/'0' -->
                    <select id="alimentador" th:field="*{alimentador}">
                        <option value="1">Sim</option>
                        <option value="0">Não</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="xarope">Xarope (Litros):</label>
                    <input type="number" id="xarope" th:field="*{xarope}" step="0.1" min="0">
                </div>
                <div class="form-group">
                    <label for="bifeProteico">Bife Proteico (Gramas):</label>
                    <!-- ID Padronizado para camelCase (bifeProteico) -->
                    <input type="number" id="bifeProteico" th:field="*{bifeProteico}" min="0">
                </div>
                
                <div class="form-group">
                    <label for="rainhaNova">Rainha Nova (Ano/Identificação):</label>
                    <!-- ID Padronizado para camelCase (rainhaNova) -->
                    <input type="text" id="rainhaNova" th:field="*{rainhaNova}" placeholder="Ex: 2025-R01">
                </div>
                <div class="form-group">
                    <label for="melgueiras">Melgueiras (Adicionadas/Retiradas):</label>
                    <input type="text" id="melgueiras" th:field="*{melgueiras}" placeholder="Ex: +1, -2">
                </div>
                <div class="form-group">
                    <label for="inimigosNaturais">Inimigos Naturais (Vistos):</label>
                    <!-- ID Padronizado para camelCase (inimigosNaturais) -->
                    <input type="text" id="inimigosNaturais" th:field="*{inimigosNaturais}" placeholder="Ex: Falsa-Mofo, Ácaro">
                </div>
                
                <div class="form-group">
                    <label for="obs">Observações:</label>
                    <textarea id="obs" th:field="*{obs}" rows="4" placeholder="Detalhes importantes do manejo."></textarea>
                </div>

				<button type="submit" class="btn btn-primary">Registrar Manejo</button>
               
			</form>

			<div class="form-link">
				<p><a th:href="@{/gerenciar/manejo}">Novo Manejo</a> ou <a th:href="@{/dashboard}">Voltar</a></p>
			</div>
		</div>
	</div>

    <script th:src="@{/js/script_manejo.js}"></script>
</body>

</html>
