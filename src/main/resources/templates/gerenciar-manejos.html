<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Gerenciar Manejos - MelinaBit</title>
	<link rel="stylesheet" th:href="@{/css/global.css}">
	<link rel="stylesheet" th:href="@{/css/gerenciar.css}">
</head>
<body class="allow-scroll">

<div class="manage-apiary-wrapper">
	<div class="manage-apiary-box">
		<h3>Gerenciamento de Manejos</h3>

		<div th:if="${mensagemSucesso}" class="manage-apiary-alert manage-apiary-success" th:text="${mensagemSucesso}"></div>
		<div th:if="${mensagemErro}" class="manage-apiary-alert manage-apiary-danger" th:text="${mensagemErro}"></div>

		<form th:action="@{/gerenciar/gerenciar-manejos}" method="get" class="manage-apiary-search">
			<input type="text" name="keyword" th:value="${keyword}" placeholder="Pesquisar por colmeia ou apiário..." class="manage-apiary-input-search">
			<button type="submit" class="manage-apiary-btn-save" style="width: 150px; margin: 0;">Pesquisar</button>
		</form>

		<hr>

		<form th:action="@{/gerenciar/salvar-manejo}" th:object="${manejo}" method="post">
			<input type="hidden" th:field="*{idManejo}">
			<input type="hidden" th:field="*{usuario}">
			<input type="hidden" th:if="*{apiario != null}" th:field="*{apiario.idApiario}">

			<div class="manage-apiary-grid">
				<div class="manage-apiary-field">
					<label>Apiário:</label>
					<input type="text" th:field="*{apiario.nome}" readonly style="background-color: #f0f0f0; cursor: not-allowed;">
				</div>
				<div class="manage-apiary-field">
					<label>Nº Colmeia:</label>
					<input type="text" th:field="*{numeroColmeia}" required>
				</div>
				<div class="manage-apiary-field">
					<label>Data do Manejo:</label>
					<input type="date" th:field="*{dataInspecao}" required>
				</div>
			</div>

			<div class="manage-apiary-grid">
				<div class="manage-apiary-field">
					<label>Quadros com Ovos:</label>
					<input type="number" th:field="*{quadros}">
				</div>
				<div class="manage-apiary-field">
					<label>Crias Operculadas:</label>
					<input type="number" th:field="*{criasOperculadas}">
				</div>
				<div class="manage-apiary-field">
					<label>Quadros com Mel:</label>
					<input type="number" th:field="*{mel}">
				</div>
			</div>

			<div class="manage-apiary-grid">
				<div class="manage-apiary-field">
					<label>Pólen (0 ou 1):</label>
					<input type="number" th:field="*{polen}" class="mask-binary" min="0" max="1" placeholder="0=Não, 1=Sim">
				</div>
				<div class="manage-apiary-field">
					<label>Néctar (0 ou 1):</label>
					<input type="number" th:field="*{nectar}" class="mask-binary" min="0" max="1">
				</div>
				<div class="manage-apiary-field">
					<label>Própolis (0 ou 1):</label>
					<input type="number" th:field="*{propolis}" class="mask-binary" min="0" max="1">
				</div>
			</div>

			<div class="manage-apiary-grid">
				<div class="manage-apiary-field">
					<label>Rainha Nova (true/false):</label>
					<input type="text" th:field="*{rainhaNova}" placeholder="true ou false">
				</div>
				<div class="manage-apiary-field">
					<label>Inimigos Naturais:</label>
					<input type="text" th:field="*{inimigosNaturais}" placeholder="Ex: Não, Formigas, etc">
				</div>
				<div class="manage-apiary-field">
					<label>Alimentador (0 ou 1):</label>
					<input type="number" th:field="*{alimentador}" class="mask-binary" min="0" max="1">
				</div>
			</div>

			<div class="manage-apiary-grid">
				<div class="manage-apiary-field">
					<label>Xarope (Litros):</label>
					<input type="number" step="0.1" th:field="*{xarope}" class="mask-decimal">
				</div>
				<div class="manage-apiary-field">
					<label>Bife Proteico (g):</label>
					<input type="number" th:field="*{bifeProteico}">
				</div>
				<div class="manage-apiary-field">
					<label>Melgueiras (+/-):</label>
					<input type="text" th:field="*{melgueiras}">
				</div>
			</div>

			<div class="manage-apiary-field">
				<label>Observações:</label>
				<textarea th:field="*{obs}" rows="2" class="manage-apiary-field-obs"></textarea>
			</div>

			<div class="manage-apiary-field">
				<button type="submit" class="manage-apiary-btn-save"
						th:text="${manejo.idManejo != null ? 'Atualizar Manejo' : 'Salvar Manejo'}">
				</button>
			</div>
		</form>

		<hr>

		<h3>Lista de Manejos Realizados</h3>
		<div class="manage-apiary-table-scroll">
			<table class="manage-apiary-table">
				<thead>
				<tr>
					<th>Data</th>
					<th>Apiário</th>
					<th>Colmeia</th>
					<th>Ações</th>
				</tr>
				</thead>
				<tbody>
				<tr th:each="m : ${manejos}">
					<td th:text="${#temporals.format(m.dataInspecao, 'dd/MM/yyyy')}"></td>
					<td th:text="${m.apiario != null ? m.apiario.nome : 'N/A'}"></td>
					<td th:text="${m.numeroColmeia}"></td>
					<td>
						<a th:href="@{/gerenciar/gerenciar-manejos/editar/{id}(id=${m.idManejo})}" class="manage-apiary-btn-edit">Editar</a>
						<a th:href="@{/gerenciar/excluir-manejo/{id}(id=${m.idManejo})}" class="manage-apiary-btn-delete" onclick="return confirm('Deseja excluir?')">Excluir</a>
					</td>
				</tr>
				</tbody>
			</table>
		</div>

		<div class="manage-apiary-field" style="margin-top: 20px;">
			<a th:href="@{/dashboard}" class="manage-apiary-btn-save">Voltar ao Painel</a>
		</div>
	</div>
</div>

<script>
	document.addEventListener('DOMContentLoaded', function() {

		// 1. Validação para campos 0 ou 1 (Sim/Não)
		const binaryInputs = document.querySelectorAll('.mask-binary');
		binaryInputs.forEach(input => {
			input.addEventListener('change', (e) => {
				const val = e.target.value;
				if (val !== "" && val !== "0" && val !== "1") {
					alert("Atenção: Use apenas 0 (Não) ou 1 (Sim).");
					e.target.value = "";
				}
			});
		});

		// 2. Correção de vírgula para ponto em campos decimais (Xarope, Preço, etc)
		const decimalInputs = document.querySelectorAll('.mask-decimal, input[step="0.01"], input[step="0.1"]');
		decimalInputs.forEach(input => {
			input.addEventListener('input', (e) => {
				if (e.target.value.includes(',')) {
					e.target.value = e.target.value.replace(',', '.');
				}
			});
		});

		// 3. Auto-format para true/false no campo Rainha Nova
		const rainhaInput = document.querySelector('input[name="rainhaNova"]');
		if(rainhaInput) {
			rainhaInput.addEventListener('blur', (e) => {
				let val = e.target.value.toLowerCase().trim();
				if (val === 's' || val === 'sim' || val === 't' || val === '1') e.target.value = 'true';
				if (val === 'n' || val === 'nao' || val === 'não' || val === 'f' || val === '0') e.target.value = 'false';
			});
		}
	});
</script>

</body>
</html>
