<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Manejo - MelinaBit</title>
    <!-- Mantenha seus links CSS existentes -->
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/cadastro.css}">
    <style>
        /* Ajuste para o campo de observação ocupar toda a largura e ter altura */
        .obs-container {
            width: 100%;
            grid-column: 1 / -1; /* Caso use grid no seu CSS original */
        }
        textarea#obs {
            width: 100%;
            min-height: 120px;
            padding: 10px;
            box-sizing: border-box;
            font-family: inherit;
        }
    </style>
</head>
<body class="allow-scroll">
<div class="form-wrapper">
    <div class="form-container">
        <h2>Registro de Manejo de Colmeia</h2>
        <div th:if="${mensagemSucesso}" class="alert alert-success" style="color: #155724; background-color: #d4edda; border: 1px solid #c3e6cb; padding: 15px; margin-bottom: 20px; border-radius: 4px;">
            <strong th:text="${mensagemSucesso}"></strong>
            <p>
                <a th:href="@{/dashboard}" class="btn btn-cadastrar">Voltar ao Painel</a>
            </p>
        </div>

        <div th:if="${mensagemErro}" class="alert alert-danger" style="color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; padding: 15px; margin-bottom: 20px; border-radius: 4px;">
            <strong th:text="${mensagemErro}"></strong>
            <p>
                <a th:href="@{/dashboard}" class="btn btn-cadastrar">Voltar ao Painel</a>
            </p>
        </div>
        <form th:action="@{/gerenciar/cadastro-manejos}" th:object="${manejo}" method="post">
        <input type="hidden" th:field="*{idManejo}" />
        <input type="hidden" th:field="*{usuario}" />
        <div class="form-group">
            <label for="apiarioId">Apiário:</label>

            <select id="apiarioId" th:field="*{apiario}" required class="form-group-select">

                <option value="">Selecione o Apiário</option>

                <option th:each="apiarioOp : ${apiarios}"

                        th:value="${apiarioOp.idApiario}"

                        th:text="${apiarioOp.nome}">

                </option>
            </select>
        </div>
        <div class="form-group">

            <label for="numeroColmeia">Número da Colmeia:</label>

            <input type="text" id="numeroColmeia" th:field="*{numeroColmeia}" required placeholder="Ex: 01">

        </div>



        <div class="form-group">

            <label for="dataInspecao">Data do Manejo:</label>

            <input type="date" id="dataInspecao" th:field="*{dataInspecao}" required>

        </div>



        <hr>

        <h3>Estado da Colmeia (Números)</h3>



        <div class="form-group">

            <label for="quadros">Quadros com Ovos:</label>

            <input type="number" id="quadros" th:field="*{quadros}" min="0" required>

        </div>

        <div class="form-group">

            <label for="criasOperculadas">Quadros com Crias Operculadas:</label>

            <input type="number" id="criasOperculadas" th:field="*{criasOperculadas}" min="0">

        </div>



            <div class="form-group">
                <label for="mel">Quadros com Mel:</label>
                <input type="number" id="mel" th:field="*{mel}" min="0">
            </div>
        <hr>

        <h3>Avaliação Rápida (Sim/Não)</h3>

        <div class="form-group">

            <label for="polen">Entrada de Polén?</label>

            <select id="polen" th:field="*{polen}" class="form-group-select">

                <option value="1">Sim</option>

                <option value="0">Não</option>

            </select>

        </div>



        <div class="form-group">

            <label for="nectar">Entrada de Néctar?</label>

            <select id="nectar" th:field="*{nectar}" class="form-group-select">

                <option value="1">Sim</option>

                <option value="0">Não</option>

            </select>

        </div>

            <div class="form-group">

            <label for="propolis">Possui Própolis?</label>

            <select id="propolis" th:field="*{propolis}" class="form-group-select">

                <option value="1">Sim</option>

                <option value="0">Não</option>

            </select>

        </div>

            <div class="form-group">

                <label for="rainha">Rainha Nova?</label>

                <select id="rainha" th:field="*{rainhaNova}" class="form-group-select">
                    <option th:value="true">Sim</option>
                    <option th:value="false">Não</option>

                </select>

            </div>

        <div class="form-group">

            <label for="posturasBoas">Posturas estão boas?</label>

            <select id="posturasBoas" th:field="*{posturasBoas}" class="form-group-select">

                <option value="true">Sim</option>

                <option value="false">Não</option>

            </select>

        </div>



        <div class="form-group">

            <label for="criasUniformes">Crias estão uniformes?</label>

            <select id="criasUniformes" th:field="*{criasUniformes}" class="form-group-select">

                <option value="true">Sim</option>

                <option value="false">Não</option>

            </select>

        </div>



        <div class="form-group">

            <label for="inimigosNaturais">Viu Inimigos Naturais?</label>

            <select id="inimigosNaturais" th:field="*{inimigosNaturais}" class="form-group-select">

                <option value="Não">Não</option>

                <option value="Sim">Sim</option>

            </select>

        </div>



        <hr>

        <h3>Tratos e Manutenção</h3>



        <div class="form-group">

            <label for="alimentador">Alimentador Aplicado?</label>

            <select id="alimentador" th:field="*{alimentador}" class="form-group-select">

                <option value="1">Sim</option>

                <option value="0">Não</option>

            </select>

        </div>



        <div class="form-row" style="display: flex; gap: 10px;">

            <div class="form-group" style="flex: 1;">

                <label for="xarope">Xarope (L):</label>

                <input type="number" id="xarope" th:field="*{xarope}" step="0.1" min="0">

            </div>

            <div class="form-group" style="flex: 1;">

                <label for="bifeProteico">Bife (g):</label>

                <input type="number" id="bifeProteico" th:field="*{bifeProteico}" min="0">

            </div>

        </div>



        <div class="form-group">

            <label for="melgueiras">Melgueiras (+/-):</label>

            <input type="text" id="melgueiras" th:field="*{melgueiras}" placeholder="Ex: +1 Melgueira">

        </div>



            <div class="form-group">
                <label for="obs">Observações:</label>
                <textarea id="obs" th:field="*{obs}" rows="4" class="obs"
                          placeholder="Digite aqui informações adicionais sobre o manejo..."></textarea>
            </div>

        <button type="submit" class="btn btn-primary">Salvar Registro de Manejo</button>
        </form>

        <div class="form-link">
            <p>
                <a th:href="@{/dashboard}" class="btn btn-cadastrar">Voltar ao Painel</a>
            </p>
        </div>
    </div>
</div>

        <script th:src="@{/js/script_manejo.js}"></script>
</body>

</html>
