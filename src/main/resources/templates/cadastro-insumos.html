<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cadastro de Entrada de Material - MelinaBit</title>
	<link rel="stylesheet" th:href="@{/css/global.css}">
	<link rel="stylesheet" th:href="@{/css/cadastro.css}">
</head>
<body class="allow-scroll">
<div class="form-wrapper">
	<div class="form-container">
		<h2>Cadastro de Materiais Apícolas e Insumos</h2>

		<div th:if="${mensagemSucesso}" class="alert alert-success" style="color: #155724; background-color: #d4edda; border: 1px solid #c3e6cb; padding: 15px; margin-bottom: 20px; border-radius: 4px;">
			<strong th:text="${mensagemSucesso}"></strong>
			<p><a th:href="@{/dashboard}" class="btn btn-cadastrar">Voltar ao Painel</a></p>
		</div>

		<div th:if="${mensagemErro}" class="alert alert-danger" style="color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; padding: 15px; margin-bottom: 20px; border-radius: 4px;">
			<strong th:text="${mensagemErro}"></strong>
			<p><a th:href="@{/dashboard}" class="btn btn-cadastrar">Voltar ao Painel</a></p>
		</div>

		<form th:action="@{/gerenciar/salvar}" th:object="${movimentacao}" method="post">
			<input type="hidden" th:field="*{tipoMovimentacao}">

			<input type="hidden" name="referencia" value="cadastro-insumos">

			<div class="form-group">
				<label for="fornecedor">Fornecedor:</label>
				<select th:field="*{fornecedor.id}" id="fornecedor" required class="form-group-select">
					<option value="">Selecione um fornecedor</option>
					<option th:each="f : ${fornecedores}" th:value="${f.id}" th:text="${f.nomeFornecedor}"></option>
				</select>
			</div>

			<div class="form-group">
				<label>Data da Entrada:</label>
				<input type="date" th:field="*{dataEntrada}" required>
			</div>

			<div class="form-group">
				<label for="nome">Nome do Insumo:</label>
				<input type="text" id="nome" th:field="*{nome}" placeholder="Ex: Cera Alveolada, Arame" required>
			</div>

			<div class="form-group">
				<label for="quantidade">Quantidade:</label>
				<input type="number" id="quantidade" th:field="*{quantidade}" step="1" min="1" required>
			</div>

			<div class="form-group">
				<label for="valorUnitario">Valor Unitário (R$):</label>
				<input type="number" id="valorUnitario" name="valorUnitario" step="0.01" min="0">
			</div>

			<div class="form-group">
				<label for="valorFrete">Valor do Frete (R$):</label>
				<input type="number" id="valorFrete" th:field="*{valorFrete}" step="0.01" min="0">
			</div>

			<div class="form-group">
				<label for="valorTotalVisual">Valor Total Pago (R$):</label>
				<input type="number" id="valorTotalVisual" th:field="*{valorCompra}" readonly style="background-color: #f0f0f0;">
				<small>Cálculo automático: (Qtd * Unitário) + Frete</small>
			</div>

			<div class="form-group">
				<label for="obs">Observações:</label>
				<textarea id="obs" th:field="*{obs}" rows="4" class="obs" placeholder="Digite aqui informações adicionais..."></textarea>
			</div>

			<button type="submit" class="btn btn-primary">Registrar no Estoque</button>
		</form>

		<div class="form-link">
			<a th:href="@{/dashboard}" class="btn btn-gerenciar">Voltar ao Painel</a>
		</div>
	</div>
</div>

	<script th:src="@{/js/script.js}"></script>

</body>
</html>
