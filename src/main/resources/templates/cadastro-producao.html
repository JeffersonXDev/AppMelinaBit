<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cadastro de Produção - MelinaBit</title>
	<link rel="stylesheet" th:href="@{/css/global.css}">
	<link rel="stylesheet" th:href="@{/css/cadastro.css}">
</head>
<body class="allow-scroll">
<div class="form-wrapper">
	<div class="form-container">
		<h2>Cadastrar Produção.</h2>

		<div th:if="${mensagemSucesso}" class="alert alert-success" style="color: #155724; background-color: #d4edda; border: 1px solid #c3e6cb; padding: 15px; margin-bottom: 20px; border-radius: 4px;">
			<strong th:text="${mensagemSucesso}"></strong>
			<p><a th:href="@{/dashboard}" class="btn btn-cadastrar">Voltar ao Painel</a></p>
		</div>

		<div th:if="${mensagemErro}" class="alert alert-danger" style="color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; padding: 15px; margin-bottom: 20px; border-radius: 4px;">
			<strong th:text="${mensagemErro}"></strong>
			<p><a th:href="@{/dashboard}" class="btn btn-cadastrar">Voltar ao Painel</a></p>
		</div>

		<form th:action="@{/gerenciar/salvar}" th:object="${movimentacao}" method="post">

			<input type="hidden" th:field="*{tipoMovimentacao}">

			<input type="hidden" name="referencia" value="cadastro-producao" >

			<div class="form-group">
				<label>Data da Colheita:</label>
				<input type="date" th:field="*{dataEntrada}" required>
			</div>

			<div class="form-group">
				<label for="tipoProduto">Produto:</label>
				<select id="tipoProduto" th:field="*{nome}" class="form-group-select">
					<option value="" disabled selected>-- Escolha o Produto --</option>
					<option value="Mel">Mel</option>
					<option value="Polen">Pólen</option>
					<option value="Propolis">Própolis</option>
					<option value="Cera">Cera</option>
				</select>
			</div>

			<div class="form-group">
				<label for="apiario">Origem (Apiário):</label>
				<select id="apiario" th:field="*{apiario.idApiario}" class="form-group-select">
					<option value="" disabled selected>-- Selecione o Apiário --</option>
					<option th:each="a : ${apiarios}"
							th:value="${a.idApiario}"
							th:text="${a.nome}"></option>
				</select>
			</div>

			<div class="form-group" style="display: flex; gap: 10px; align-items: flex-end;">
				<div style="flex: 2;">
					<label for="quantidade">Quantidade Produzida:</label>
					<input type="number" id="quantidade" th:field="*{quantidade}" step="0.01" min="0.1" placeholder="Ex: 10.5" required style="width: 100%;">
				</div>

				<div style="flex: 1;">
					<label for="unidadeMedida">Unidade:</label>
					<select id="unidadeMedida" th:field="*{unidadeMedida}" class="form-group-select">
						<option value="kg">Quilo (Kg)</option>
						<option value="g">Grama (g) </option>
						<option value="L">Litros (L)</option>
						<option value="ml">Mililitros (ml)</option>
						<option value="Un">Unidades (Un)</option>
					</select>
				</div>
			</div>

			<div class="form-group">
				<label for="obs">Observações:</label>
				<textarea id="obs" th:field="*{obs}" rows="4" class="obs"
						  placeholder="Digite aqui informações adicionais..."></textarea>
			</div>

			<button type="submit" class="btn btn-primary">Registrar Produção</button>
		</form>

		<div class="form-link">
			<p>
				<a th:href="@{/dashboard}" class="btn btn-cadastrar">Voltar ao Painel</a>
			</p>
		</div>
	</div>
</div>
</body>
</html>
