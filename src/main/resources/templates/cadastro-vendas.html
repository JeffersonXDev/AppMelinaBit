<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cadastro de Vendas - MelinaBit</title>
	<link rel="stylesheet" th:href="@{/css/global.css}">
	<link rel="stylesheet" th:href="@{/css/cadastro.css}">
</head>

<body class="allow-scroll">
<div class="form-wrapper">
	<div class="form-container">
		<h2>Cadastro de Vendas.</h2>

		<div th:if="${mensagemSucesso}" class="alert alert-success" style="color: #155724; background-color: #d4edda; border: 1px solid #c3e6cb; padding: 15px; margin-bottom: 20px; border-radius: 4px;">
			<strong th:text="${mensagemSucesso}"></strong>
			<p>
				<a th:href="@{/dashboard}" class="btn btn-cadastrar">Voltar ao Painel</a>
			</p>
		</div>

		<div th:if="${mensagemErro}" class="alert alert-danger" style="color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; padding: 15px; margin-bottom: 20px; border-radius: 4px;">
			<strong th:text="${mensagemErro}"></strong>
			<p>
				<a th:href="@{/dashboard}" class="btn btn-cadastrar">Voltar ao Painel</a>
			</p>
		</div>

		<form th:action="@{/gerenciar/salvar}" th:object="${movimentacao}" method="post">
			<input type="hidden" th:field="*{idMovimentacao}">
			<input type="hidden" th:field="*{tipoMovimentacao}">

			<input type="hidden" name="referencia" value="cadastro-vendas">

			<div class="form-group">
				<label for="descricao">Nome Identificador da Venda:</label>
				<input type="text" id="descricao" th:field="*{descricao}" placeholder="Ex: Venda Mel Lote 01" required>
			</div>

			<div class="form-group">
				<label for="cliente">Cliente:</label>
				<select id="cliente" th:field="*{cliente.id}" required class="form-group-select">
					<option value="">Selecione o Cliente</option>
					<option th:each="cliente : ${clientes}"
							th:value="${cliente.id}"
							th:text="${cliente.nomeCliente}">Nome do Cliente</option>
				</select>
			</div>

			<div class="form-group">
				<label for="unidadeMedida">Produto:</label>
				<select id="unidadeMedida" th:field="*{unidadeMedida}" onchange="atualizarNomeProduto(this)" required class="form-group-select">
					<option value="">Selecione o Tipo e Peso/Volume</option>
					<optgroup label="Mel">
						<option value="250g">Frasco 250 Gramas</option>
						<option value="500g">Frasco 500 Gramas</option>
						<option value="750g">Frasco 750 Gramas</option>
						<option value="1kg">Frasco 1 Quilo</option>
						<option value="10kg">Balde 10 Quilos</option>
						<option value="20kg">Balde 20 Quilos</option>
						<option value="30kg">Balde 30 Quilos</option>
					</optgroup>
					<optgroup label="Pólen">
						<option value="1kg">Pote de 1 Quilo (Kg)</option>
						<option value="500g">Pote de 500 Gramas</option>
						<option value="250g">Pote de 250 Gramas</option>
						<option value="100g">Pote de 100 Gramas</option>
					</optgroup>
					<optgroup label="Cera">
						<option value="1kg">Cera de 1 Quilo (Kg)</option>
						<option value="500g">Cera de 500 Gramas</option>
						<option value="250g">Cera de 250 Gramas</option>
					</optgroup>
					<optgroup label="Própolis">
						<option value="1L">Frasco 1 Litro (L)</option>
						<option value="500ml">Frasco 500ml</option>
						<option value="250ml">Frasco 250ml</option>
						<option value="100ml">Frasco 100ml</option>
						<option value="30ml">Frasco 30ml</option>
					</optgroup>
				</select>
				<input type="hidden" id="nomeProdutoOculto" th:field="*{nome}">
			</div>


			<div class="form-group">
				<label for="quantidade">Quantidade de Itens:</label>
				<input type="number" id="quantidade" th:field="*{quantidade}" min="1" required>
			</div>

			<div class="form-group">
				<label for="valorUnitario">Preço Unitário de Venda (R$):</label>
				<input type="number" id="valorUnitario" name="valorUnitario" step="0.01" min="0" required>
			</div>

			<div class="form-group">
				<label for="valorFrete">Valor do Frete de Entrega (R$):</label>
				<input type="number" id="valorFrete" name="valorFrete" step="0.01" min="0" 	 required>
			</div>

			<div class="form-group">
				<label for="valorTotalVisual">Valor Total da Venda (R$):</label>
				<input type="number" id="valorTotalVisual" readonly style="background-color: #f0f0f0;">
				<input type="hidden" id="valorTotalReal" th:field="*{valorVenda}">
				<small>Cálculo: (Qtd * Preço Unitário) + Frete</small>
			</div>
			<div class="form-group">
				<label for="obs">Observações:</label>
				<textarea id="obs" th:field="*{obs}" rows="4" class="obs"
						  placeholder="Digite aqui informações adicionais sobre a venda..."></textarea>
			</div>

			<button type="submit" class="btn btn-primary">Finalizar Venda</button>
		</form>

		<div class="form-link">
			<p>
				<a th:href="@{/dashboard}" class="btn btn-cadastrar">Voltar ao Painel</a>
			</p>
		</div>
	</div>
</div>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
