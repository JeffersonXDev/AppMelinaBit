<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cadastro - MelinaBit, Seu Gerenciamento de Apiários!</title>
	<link rel="stylesheet" th:href="@{/css/global.css}">
	<link rel="stylesheet" th:href="@{/css/cadastro.css}">
    </head>

	<body class="allow-scroll">

	    <div class="form-wrapper">
	        <div class="form-container">
	            <h2>Cadastro de Clientes:</h2>
	            <form th:action="@{/gerenciar/clientes}" th:object="${cliente}" method="post">
	                
	                <div th:if="${erro}" class="alert alert-danger">
	                    <p th:text="${erro}"></p>
	                </div>
	                
	                <div class="form-group">
	                    <label for="nome">Nome do Cliente:</label>
	                    <input type="text" id="nome" th:field="*{nomeCliente}" required>
	                </div>

	                <div class="form-group">
	                    <label for="endereco">Endereço:</label>
	                    <input type="text" id="endereco" th:field="*{endereco}" required>
	                </div>

	                <div class="form-group">
	                    <label for="numero">Número:</label>
	                    <input type="text" id="numero" th:field="*{numero}" required> 
	                </div>
	                
	                <div class="form-group">
	                    <label for="telefone">Telefone:</label>
	                    <input type="text" id="telefone" th:field="*{telefone}" required>
	                </div>

	                <div class="form-group">
	                    <label for="email">E-Mail:</label>
	                    <input type="text" id="email" th:field="*{email}" required> 
	                </div>

	                <div class="form-group">
	                    <label for="cidade">Cidade:</label>
	                    <input type="text" id="cidade" th:field="*{cidade}"> 
	                </div>
	                
	                <div class="form-group">
	                    <label for="estado">Estado:</label>
	                    <input type="text" id="estado" th:field="*{estado}">
	                </div>
	            
	                <button type="submit" class="btn btn-primary">Cadastrar</button>
	            </form>
					<div class="form-link">
					<p><a th:href="@{/dashboard}">Cadastrar outro Cliente </a> ou <a th:href="@{/dashboard}">Voltar</a></p>	
					</div>
					
			</div>
		</div>
		</body>
		</html>
