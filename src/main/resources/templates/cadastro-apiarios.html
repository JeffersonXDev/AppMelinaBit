<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cadastro - MelinaBit, Seu Gerenciamento de Apiários!</title>
	<link rel="stylesheet" th:href="@{/css/global.css}">
	<link rel="stylesheet" th:href="@{/css/cadastro.css}">
</head>

<body class="allow-scroll">

<div class="form-wrapper">
	<div class="form-container">
		<h2>Cadastro de Apiários:</h2>
		<div th:if="${mensagemSucesso}" class="alert alert-success" style="color: #155724; background-color: #d4edda; border: 1px solid #c3e6cb; padding: 15px; margin-bottom: 20px; border-radius: 4px;">
			<strong th:text="${mensagemSucesso}"></strong>
			<p>
				<a th:href="@{/dashboard}" class="btn btn-cadastrar">Voltar ao Painel</a>
			</p>
		</div>

		<div th:if="${mensagemErro}" class="alert alert-danger" style="color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; padding: 15px; margin-bottom: 20px; border-radius: 4px;">
			<strong th:text="${mensagemErro}"></strong>
			<p>
				<a th:href="@{/dashboard}" class="btn btn-cadastrar">Voltar ao Painel</a>
			</p>
		</div>

		<form th:action="@{/gerenciar/cadastro-apiarios}" th:object="${apiario}" method="post">

			<div th:if="${erro}" class="alert alert-danger">
				<p th:text="${erro}"></p>
			</div>

			<div class="form-group">
				<label for="nome">Nome do Apiário:</label>
				<input type="text" id="nome" th:field="*{nome}" required>
			</div>

			<div class="form-group">
				<label for="dataInstalacao">Data da Instalação:</label>
				<input type="date" id="dataInstalacao" th:field="*{dataInstalacao}">
			</div>

			<div class="form-group">
				<label for="qntdColmeias">Quantidade de Colmeias:</label>
				<input type="number" id="qntdColmeias" th:field="*{qntdColmeias}" required>
			</div>

			<div class="form-group">
				<label for="terraTerceiros">Esta em Terras de Terceiros?</label>
				<select id="terraTerceiros" th:field="*{terraTerceiros} " class="form-group-select"	>
					<option th:value="true">Sim</option>
					<option th:value="false">Não</option>
				</select>
			</div>

			<div class="form-group">
				<label for="nomeResponsavel">Nome Responsavel Pela Terra:</label>
				<input type="text" id="nomeResponsavel" th:field="*{nomeResponsavel}" required>
			</div>

			<div class="form-group">
				<label for="telefoneResponsavel">Telefone Responsável Pela Terra:</label>
				<input type="text" id="telefoneResponsavel" th:field="*{telefoneResponsavel}" required>
			</div>

			<div class="form-group">
				<label for="endereco">Endereço:</label>
				<input type="text" id="endereco" th:field="*{endereco}" required>
			</div>

			<div class="form-group">
				<label for="numero">Número:</label>
				<input type="text" id="numero" th:field="*{numero}" required>
			</div>

			<div class="form-group">
				<label for="cidade">Cidade:</label>
				<input type="text" id="cidade" th:field="*{cidade}">
			</div>

			<div class="form-group">
				<label for="estado">Estado:</label>
				<input type="text" id="estado" th:field="*{estado}" oninput="preencherUF()" placeholder="Ex: São Paulo">
			</div>

			<div class="form-group">
				<label for="uf">UF:</label>
				<input type="text" id="uf" th:field="*{uf}" readonly
					   style="background-color: #f0f0f0; cursor: not-allowed;"
					   placeholder="Auto-preenchido">
			</div>

			<div class="form-group">
				<label for="obs">Observações:</label>
				<textarea id="obs" th:field="*{obs}" rows="4" class="obs"
						  placeholder="Digite aqui informações adicionais sobre o apiário..."></textarea>
			</div>

			<button type="submit" class="btn btn-primary">Cadastrar</button>
		</form>

		<div class="form-link">
			<p>
				<a th:href="@{/dashboard}" class="btn btn-cadastrar">Voltar ao Painel</a>
			</p>
		</div>
	</div>
</div>
<script>
	function preencherUF() {
		// Remove acentos e padroniza para busca
		const estadoInput = document.getElementById('estado').value
				.normalize('NFD').replace(/[\u0300-\u036f]/g, "")
				.trim().toLowerCase();

		const ufInput = document.getElementById('uf');

		const estadosUf = {
			"acre": "AC", "alagoas": "AL", "amapa": "AP", "amazonas": "AM",
			"bahia": "BA", "ceara": "CE", "distrito federal": "DF", "espirito santo": "ES",
			"goias": "GO", "maranhao": "MA", "mato grosso": "MT", "mato grosso do sul": "MS",
			"minas gerais": "MG", "para": "PA", "paraiba": "PB", "parana": "PR",
			"pernambuco": "PE", "piaui": "PI", "rio de janeiro": "RJ", "rio grande do norte": "RN",
			"rio grande do sul": "RS", "rondonia": "RO", "roraima": "RR", "santa catarina": "SC",
			"sao paulo": "SP", "sergipe": "SE", "tocantins": "TO"
		};

		// Preenche se encontrar no mapa, senão limpa
		ufInput.value = estadosUf[estadoInput] || "";
	}
</script>
</body>
</html>
