<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cadastro - MelinaBit, Seu Gerenciamento de Apiários!</title>
	<link rel="stylesheet" th:href="@{/css/global.css}">
	<link rel="stylesheet" th:href="@{/css/cadastro.css}">
    </head>

<body class="allow-scroll">

	<div class="form-wrapper">
		<div class="form-container">
			<h2>Cadastro de Fornecedor:</h2>
			<form th:action="@{/gerenciar/fornecedores}" th:object="${fornecedor}" method="post">
				
				<div class="form-group">
				    <label for="nomeFornecedor">Nome:</label>
				    <input type="text" id="nomeFornecedor" th:field="*{nomeFornecedor}" required>
				</div>

				<div class="form-group">
					<label for="telefone">Telefone:</label>
					<input type="tel" id="telefone" th:field="*{telefone}">
				</div>

				<div class="form-group">
					<label for="email">E-mail:</label>
					<input type="email" id="email" th:field="*{email}" required>
				</div>

				<div class="form-group">
					<label for="cnpj">CNPJ:</label>
                    <input type="text" id="cnpj" th:field="*{cnpj}" required> 
				</div>

				<div class="form-group">
					<label for="endereco">Endereço:</label>
					<input type="text" id="endereco" th:field="*{endereco}" required>
				</div>

				<div class="form-group">
					<label for="numero">Número:</label>
                    <input type="text" id="numero" th:field="*{numero}" required> 
				</div>

				<div class="form-group">
					<label for="cidade">Cidade:</label>
					<input type="text" id="cidade" th:field="*{cidade}"> 
				</div>
                
				<div class="form-group">
					<label for="estado">Estado:</label>
					<input type="text" id="estado" th:field="*{estado}">
				</div>
				            
				<button type="submit" class="btn btn-primary">Cadastrar</button>
                
			</form>

			<div class="form-link">
								<p><a th:href="@{/gerenciar/fornecedores}">Cadastrar outro Fornecedor</a> ou <a th:href="@{/dashboard}">Voltar</a></p>	
			</div>
		</div>
	</div>

    <script th:src="@{/js/script.js}"></script>
</body>

</html>
