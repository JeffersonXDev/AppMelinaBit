<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cadastro - MelinaBit</title>
	<link rel="stylesheet" th:href="@{/css/global.css}">
	<link rel="stylesheet" th:href="@{/css/cadastro.css}">
	<style>
		/* Estilos rápidos para as mensagens */
		.alert { padding: 15px; margin-bottom: 20px; border-radius: 4px; text-align: center; }
		.alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
		.alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
		.btn-success { background-color: #28a745; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; margin-top: 10px; }
	</style>
</head>

<body class="allow-scroll">

<div class="form-wrapper">
	<div class="form-container">
		<h2>Cadastro:</h2>

		<div th:if="${mensagemSucesso}" class="alert alert-success">
			<p th:text="${mensagemSucesso}"></p>
			<br>
			<a th:href="@{/login}" class="btn-success">Ir para o Login</a>
		</div>

		<div th:if="${erroSenha}" class="alert alert-danger">
			<p th:text="${erroSenha}"></p>
		</div>

		<form th:if="${mensagemSucesso == null}" th:action="@{/cadastro}" th:object="${usuario}" method="post">

			<div class="form-group">
				<label for="nome">Nome:</label>
				<input type="text" id="nome" th:field="*{nome}" required>
			</div>

			<div class="form-group">
				<label for="telefone">Telefone:</label>
				<input type="tel" id="telefone" th:field="*{telefone}">
			</div>

			<div class="form-group">
				<label for="email">E-Mail:</label>
				<input type="email" id="email" th:field="*{email}" required>
			</div>

			<div class="form-group">
				<label for="cpf">CPF:</label>
				<input type="text" id="cpf" th:field="*{cpf}" required>
			</div>

			<div class="form-group">
				<label for="endereco">Endereço:</label>
				<input type="text" id="endereco" th:field="*{endereco}" required>
			</div>

			<div class="form-group">
				<label for="numero">Número:</label>
				<input type="text" id="numero" th:field="*{numero}" required>
			</div>

			<div class="form-group">
				<label for="cidade">Cidade:</label>
				<input type="text" id="cidade" th:field="*{cidade}">
			</div>

			<div class="form-group">
				<label for="estado">Estado:</label>
				<input type="text" id="estado" th:field="*{estado}"
					   oninput="preencherUF()"
					   placeholder="Ex: São Paulo">
			</div>

			<div class="form-group">
				<label for="uf">UF:</label>
				<input type="text" id="uf" th:field="*{uf}" readonly
					   style="background-color: #f0f0f0; cursor: not-allowed;"
					   placeholder="Auto-preenchido">
			</div>

			<div class="form-group">
				<label for="senha">Senha:</label>
				<input type="password" id="senha" th:field="*{senha}" required>
			</div>

			<div class="form-group">
				<label for="confirmarSenha">Confirmar Senha:</label>
				<input type="password" id="confirmarSenha" name="confirmarSenha" required>
			</div>

			<div class="form-group checkbox-group">
				<input type="checkbox" id="lgpdAceito" th:field="*{lgpdAceito}" required>
				<label for="lgpdAceito">Eu concordo com os termos e a política de privacidade (LGPD).</label>
			</div>

			<button type="submit" class="btn btn-primary">Cadastrar Conta</button>
		</form>

		<hr th:if="${mensagemSucesso == null}">

		<div class="form-link" th:if="${mensagemSucesso == null}">
			<p>Já tem uma conta? <a th:href="@{/login}" class="btn-link">Faça login</a></p>
		</div>

		<div class="form-link">
			<a th:href="@{/login}" class="btn btn-gerenciar">Sair</a>
		</div>
	</div>
</div>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
